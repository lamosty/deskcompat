name: Feature proposal
description: Propose a narrowly scoped behavior or supported platform change.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow mismatch rather than only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Which resources, platforms, and modules would be involved?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Detection, rollback, and failure behavior
    validations:
      required: true
  - type: dropdown
    id: maintainer
    attributes:
      label: Can you help maintain and test this integration?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true
