name: Bug report
description: Report a reproducible DeskCompat defect without private host data.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not post secrets, full environment dumps, raw dconf exports, window titles, or hardware serials.
  - type: input
    id: version
    attributes:
      label: DeskCompat version
      placeholder: Commit SHA or release
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Supported environment
      description: Ubuntu, GNOME, and Wayland versions only.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Prefer stable diagnostic codes. Remove paths, names, titles, and device identifiers.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and identifying host data.
          required: true
